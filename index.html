<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arc — Personal AI Assistant</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f7f7f8;color:#202123;height:100vh;display:flex}
aside{width:240px;background:#202123;color:white;padding:16px}.logo{font-size:21px;font-weight:bold;padding:10px 5px 20px}
button{border:0;border-radius:8px;padding:10px 15px;cursor:pointer;background:#19c37d;color:white;font-weight:bold}
.new{width:100%;text-align:left;background:transparent;border:1px solid #666}.menu{color:#bbb;margin-top:20px}.menu div{padding:12px 6px}
main{flex:1;display:flex;flex-direction:column}.top{height:60px;background:white;border-bottom:1px solid #ddd;padding:20px;font-weight:bold}
.chat{flex:1;overflow:auto;padding:25px 8%}.welcome{text-align:center;margin:12vh auto;max-width:650px}.welcome h1{font-size:32px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:25px}.card{background:white;border:1px solid #ddd;border-radius:10px;padding:16px;text-align:left;cursor:pointer}
.msg{display:flex;gap:13px;margin:20px 0;line-height:1.55}.avatar{width:32px;height:32px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:bold;flex:none}.ai .avatar{background:#19c37d;color:white}.user .avatar{background:#6b5cff;color:white}.bubble{max-width:800px;white-space:pre-wrap}
.compose{padding:15px 8% 22px}.box{background:white;border:1px solid #aaa;border-radius:12px;padding:7px;display:flex;gap:8px}
textarea{flex:1;border:0;outline:0;resize:none;font:inherit;padding:12px;min-height:45px}.note{text-align:center;color:#777;font-size:11px;margin-top:8px}
@media(max-width:700px){aside{display:none}.chat{padding:20px}.compose{padding:10px 15px 18px}.cards{grid-template-columns:1fr}}
</style></head>
<body>
<aside><div class="logo">🤖 Arc</div><button class="new" onclick="location.reload()">＋ New chat</button>
<div class="menu"><div>📚 Study Mode</div><div>🧠 Quiz Mode</div><div>📝 Homework Help</div><div>📅 Study Planner</div></div></aside>
<main><div class="top">Arc <span style="color:#777;font-weight:normal"> — Personal AI Assistant</span></div>
<div class="chat" id="chat"><div class="welcome" id="welcome">
<h1 id="greeting">How can I help you today?</h1><p>Your personal AI assistant, Arc.</p>
<div style="margin:18px auto;max-width:420px;text-align:left;background:white;border:1px solid #ddd;border-radius:10px;padding:14px">
<label style="font-size:13px;color:#666">Your name</label>
<div style="display:flex;gap:8px;margin-top:7px"><input id="name" placeholder="Enter your name" style="flex:1;border:1px solid #ccc;border-radius:7px;padding:10px"><button onclick="saveName()">Save</button></div>
</div>
<div class="cards"><div class="card" onclick="fill('Explain photosynthesis in simple Class 10 language.')">🌱 Explain a science topic</div>
<div class="card" onclick="fill('Give me a 10-question Class 10 science quiz.')">🧠 Create a quiz</div>
<div class="card" onclick="fill('Make me a study plan for today.')">📅 Make a study plan</div>
<div class="card" onclick="fill('Explain this question step by step.')">📝 Homework help</div></div></div></div>
<div class="compose"><div class="box"><textarea id="input" placeholder="Message Arc..."></textarea><button id="send" onclick="send()">Send</button></div><div class="note">Arc • AI responses are generated by the connected model.</div></div>
</main>
<script>
const input=document.getElementById("input"),chat=document.getElementById("chat"),btn=document.getElementById("send");let history=[];
function fill(x){input.value=x;input.focus()}
function saveName(){
  const n=document.getElementById("name").value.trim();
  if(!n)return;
  localStorage.setItem("arc_name",n);
  document.getElementById("greeting").textContent="Hi "+n+"! How can I help you today?";
}
const savedName=localStorage.getItem("arc_name");
if(savedName) document.getElementById("greeting").textContent="Hi "+savedName+"! How can I help you today?";
function add(text,type){document.getElementById("welcome")?.remove();let r=document.createElement("div");r.className="msg "+type;let a=document.createElement("div");a.className="avatar";a.textContent=type==="ai"?"AI":"You";let b=document.createElement("div");b.className="bubble";b.textContent=text;r.append(a,b);chat.append(r);chat.scrollTop=chat.scrollHeight}
async function send(){let t=input.value.trim();if(!t||btn.disabled)return;add(t,"user");history.push({role:"user",content:t});input.value="";btn.disabled=true;btn.textContent="…";
try{let r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:history})});let d=await r.json();if(!r.ok)throw Error(d.error);add(d.reply,"ai");history.push({role:"assistant",content:d.reply})}catch(e){add("Sorry — "+e.message,"ai")}finally{btn.disabled=false;btn.textContent="Send";input.focus()}}
input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}})
</script></body></html>
